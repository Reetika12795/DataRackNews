site_name: DataRackNews Documentation
site_description: Real-time Data Center Intelligence & Monitoring Platform
site_author: Reetika
site_url: https://reetika12795.github.io/DataRackNews/

# Repository
repo_name: Reetika12795/DataRackNews
repo_url: https://github.com/Reetika12795/DataRackNews
edit_uri: edit/reet_search/docs/

# Configuration
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search
  # - mermaid2  # Temporarily disabled due to compatibility issue
  - git-revision-date-localized:
      type: date

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started/overview.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - Architecture:
    - System Overview: architecture/system-overview.md
    - Docker Architecture: architecture/docker-architecture.md
    - Data Flow: architecture/data-flow.md
    - Components: architecture/components.md
  - Features:
    - Equinix Scraping: features/equinix-scraping.md
    - PA2 Enhancement: features/pa2-enhancement.md
    - Gradio Interface: features/gradio-interface.md
    - Database Integration: features/database.md
  - API Reference:
    - Scrapers: api/scrapers.md
    - Data Models: api/data-models.md
    - Workflows: api/workflows.md
  - Deployment:
    - Local Development: deployment/local.md
    - Docker Deployment: deployment/docker.md
    - GitHub Pages: deployment/github-pages.md
  - Development:
    - Contributing: development/contributing.md
    - Testing: development/testing.md
    - Troubleshooting: development/troubleshooting.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Reetika12795/DataRackNews
  version:
    provider: mike